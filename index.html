
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Photobooth</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <!-- Left Side: Camera -->
        <div class="left-side">
            <div class="title2">
                <center>
                <h1 style="font-family: 'Playfair Display', serif; font-size: 2.5em; color: #F2CA46; font-weight: 600;
    margin-bottom: 10px; letter-spacing: 1px; overflow: hidden; ">E-Photobooth</h1></center>
            </div>

            <div class="video-container">
                <video id="video" autoplay playsinline></video>
                <canvas id="overlay-canvas"></canvas>
                <div id="countdown-display"></div>
                <div id="flash"></div>
            </div>

            <!-- Controls -->
            <div class="controls-section">
                <!-- Frame Selection -->
                <div class="control-group">
                    <label><i class="fas fa-camera"></i> Jumlah Foto</label>
                    <div class="frame-options">
                        <button class="frame-btn" data-frames="3">3 Foto</button>
                        <button class="frame-btn active" data-frames="4">4 Foto</button>
                        <button class="frame-btn" data-frames="6">6 Foto</button>
                    </div>
                </div>

                <!-- Filter Selection -->
                <div class="control-group">
                    <label><i class="fas fa-sliders-h"></i> Color Filter</label>
                    <div class="filter-options">
                        <button class="filter-btn active" data-filter="none">Normal</button>
                        <button class="filter-btn" data-filter="grayscale">B&W</button>
                        <button class="filter-btn" data-filter="sepia">Sepia</button>
                        <button class="filter-btn" data-filter="vintage">Vintage</button>
                        <button class="filter-btn" data-filter="warm">Warm</button>
                    </div>
                </div>


                <!-- Timer -->
                <div class="control-group timer-group">
                    <label><i class="fas fa-clock"></i> Timer</label>
                    <div class="timer-input-group">
                        <input type="number" min="0" max="10" placeholder="3" id="timer" value="3">
                        <span>Second</span>
                    </div>
                </div>

                <!-- Capture Button -->
                <div class="capture-container">
                    <button id="capture-btn" class="capture-button-round">
                        <div class="capture-inner"></div>
                    </button>
                    <div class="capture-text">Ambil Foto</div>
                </div>
            </div>
        </div>

        <!-- Right Side: Preview (Hidden initially) -->
        <div class="right-side" id="right-side">
            <div class="preview-section">
                <div class="preview-header">
                    <h2>Preview Foto</h2>
                </div>

                <!-- Customization Options -->
                <div class="customization-section">
                    <!-- Frame Template Selection -->
                    <div class="custom-group">
                        <label><i class="fas fa-sliders-h"></i> Pilih Template</label>
                        <div class="frame-templates-grid">
                            <button class="template-btn active" data-template="classic">
                                <div class="template-preview classic-preview"></div>
                                <span>Black</span>
                            </button>
                            <button class="template-btn" data-template="retro">
                                <div class="template-preview retro-preview"></div>
                                <span>Maroon</span>
                            </button>
                            <button class="template-btn" data-template="checkerboard">
                                <div class="template-preview checker-preview"></div>
                                <span>Navy</span>
                            </button>
                            <button class="template-btn" data-template="rainbow">
                                <div class="template-preview rainbow-preview"></div>
                                <span>Navy Blue</span>
                            </button>
                            <button class="template-btn" data-template="polaroid">
                                <div class="template-preview polaroid-preview"></div>
                                <span>White</span>
                            </button>
                            <button class="template-btn" data-template="hearts">
                                <div class="template-preview hearts-preview"></div>
                                <span>Burgundy</span>
                            </button>
                            <button class="template-btn" data-template="stars">
                                <div class="template-preview stars-preview"></div>
                                <span>Dark Navy</span>
                            </button>
                            <button class="template-btn" data-template="flowers">
                                <div class="template-preview flowers-preview"></div>
                                <span>Gray</span>
                            </button>
                            <button class="template-btn" data-template="doodle">
                                <div class="template-preview doodle-preview"></div>
                                <span>White Frame</span>
                            </button>
                            <button class="template-btn" data-template="minimal">
                                <div class="template-preview minimal-preview"></div>
                                <span>Minimal</span>
                            </button>
                        </div>
                    </div>

                    <!-- Background Color Selection -->
                    <div class="custom-group">
                        <label><i class="fas fa-palette"></i> Warna Background Strip</label>
                        <div class="bg-color-options">
                            <button class="bg-color-btn active" data-bg="black" style="background: #000000;" title="Black"></button>
                            <button class="bg-color-btn" data-bg="white" style="background: #FFFFFF; border-color: #666;" title="White"></button>
                            <button class="bg-color-btn" data-bg="navy" style="background: #1a1a2e;" title="Navy"></button>
                            <button class="bg-color-btn" data-bg="maroon" style="background: #800020;" title="Maroon"></button>
                            <button class="bg-color-btn" data-bg="burgundy" style="background: #6B1515;" title="Burgundy"></button>
                            <button class="bg-color-btn" data-bg="charcoal" style="background: #36454F;" title="Charcoal"></button>
                            <button class="bg-color-btn" data-bg="forest" style="background: #2C5F2D;" title="Forest Green"></button>
                            <button class="bg-color-btn" data-bg="midnight" style="background: #191970;" title="Midnight Blue"></button>
                        </div>
                    </div>

                    <!-- Decoration & Character Selection -->
                    <div class="custom-group">
                        <label><i class="fas fa-paint-brush"></i> Hiasan & Karakter Dekoratif</label>
                        <div class="decoration-options">
                            <button class="deco-btn active" data-deco="none">Tanpa Hiasan</button>
                            <button class="deco-btn" data-deco="butterflies"><i class="fas fa-butterfly"></i> Kupu-kupu</button>
                            <button class="deco-btn" data-deco="sparkles"><i class="fas fa-star"></i> Sparkles</button>
                            <button class="deco-btn" data-deco="stickers"><i class="fas fa-sticky-note"></i> Stickers</button>
                            <button class="deco-btn" data-deco="music">⋆.˚ ✮ 🎧</button>
                            <button class="deco-btn" data-deco="cute">𐙚 ⋆.˚</button>
                            <button class="deco-btn" data-deco="spider">🕷️ 🕸 ✮</button>
                        </div>
                    </div>

                    <!-- Sticker Integration -->
                    <div class="custom-group">
                        <label><i class="fas fa-sticky-note"></i> Tambah Sticker Custom (Bebas Susun)</label>
                        <div class="sticker-list-horizontal" id="sticker-list">
                            <!-- Stickers will be appended here via JS -->
                        </div>
                    </div>
                </div>

                <div class="preview-main">
                    <div id="canvas-wrapper">
                        <canvas id="preview-canvas"></canvas>
                        <div id="sticker-layer"></div>
                    </div>
                </div>
                <div class="preview-thumbnails" id="photo-grid"></div>
                <div class="preview-actions">
                    <button class="btn-retake" id="btn-pause-anim" style="flex: 0.5;">
                        <span><i class="fas fa-pause"></i> Pause</span>
                    </button>
                    <button class="btn-retake" id="btn-retake">
                        <span><i class="fas fa-redo"></i> Retake</span>
                    </button>
                    <button class="btn-save" id="btn-save">
                        <span><i class="fas fa-camera"></i> Save Foto (JPG)</span>
                    </button>
                    <button class="btn-save" id="btn-save-video" style="background: #e84393; border-color: #e84393; color: white;">
                        <span><i class="fas fa-film"></i> Save GIF (Live)</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <script src="script.js"></script>
</body>

</html>
